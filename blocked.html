<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stoic</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="bp">
    <header class="bp-brand">
      <span class="bp-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 3H18V5.4H13.8V18.6H18V21H6V18.6H10.2V5.4H6Z"/></svg>
      </span>
      <span class="bp-eyebrow" id="eyebrowStatus"></span>
    </header>

    <section class="bp-head">
      <h1 class="bp-title" id="headline">One moment</h1>
      <p class="bp-sub" id="subhead"></p>
    </section>

    <blockquote class="bp-reflection voice" id="placardText"></blockquote>

    <dl class="bp-facts" id="statRow"></dl>
    <p class="bp-context" id="equivalency"></p>

    <!-- The pause: only for "Pause first" rules -->
    <section class="bp-gate" id="restraintBox" hidden>
      <div class="bp-gate-head">
        <h2 class="bp-gate-title">The way through</h2>
        <span class="bp-gate-count" id="gateCount">3 steps left</span>
      </div>
      <ol class="bp-steps" id="restraintWidget"></ol>
      <div class="bp-pass">
        <span class="bp-pass-label" id="passLabel">Open it for</span>
        <div class="segmented bp-pass-seg" id="passSeg" role="radiogroup" aria-labelledby="passLabel"></div>
      </div>
    </section>

    <div class="bp-actions">
      <button class="btn-accent bp-turn" id="closeBtn" type="button">Turn back</button>
      <button class="btn-ghost bp-continue" id="continueBtn" type="button" hidden disabled>Complete the steps above</button>
    </div>

    <p class="bp-reopen tabular" id="resetNote"></p>
    <p class="bp-foot">To change this rule, open Stoic from your toolbar. Loosening it there costs more than any pass from here.</p>
  </main>

<script src="common.js"></script>
<script src="progression-model.js"></script>
<script src="progression-store.js"></script>
<script src="blocked.js"></script>
</body>
</html>
