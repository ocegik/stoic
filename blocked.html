<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stoic</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="blocked-page-wrapper">
    <div class="blocked-container">
      
      <!-- Top Bar: Brand -->
      <header class="blocked-header">
        <div class="brand-badge-row">
          <div class="mark-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3H18V5.4H13.8V18.6H18V21H6V18.6H10.2V5.4H6Z"/></svg>
          </div>
          <div class="brand-title-group">
            <span class="brand-name">Stoic</span>
            <span class="eyebrow-status" id="eyebrowStatus"></span>
          </div>
        </div>
      </header>

      <!-- Main Layout Grid -->
      <main class="blocked-grid">
        
        <!-- Left Column: Heading, Quote, Stats -->
        <section class="blocked-pane pane-info">
          <div class="pane-header-group">
            <h1 id="headline">One moment</h1>
            <p class="subhead" id="subhead"><span class="skeleton skeleton-line" style="width: 70%;">&nbsp;</span></p>
          </div>

          <div class="placard callout" id="placardBox">
            <div class="callout-label" id="calloutLabel">Reality check</div>
            <div class="callout-text" id="placardText"></div>
          </div>

          <div class="equivalency-box" id="equivalency"></div>

          <div class="stat-section-wrapper">
            <div class="stat-section-label">Where this stands</div>
            <div class="stat-row stat-grid" id="statRow"></div>
          </div>
        </section>

        <!-- Right Column: Interstitial & Actions -->
        <section class="blocked-pane pane-actions">
          <!-- Restraint Interstitial Card -->
          <div id="restraintBox" class="restraint-card" style="display: none;">
            <div class="restraint-type-badge" id="restraintBadge">THE PAUSE</div>
            <div id="restraintWidget" class="restraint-widget"></div>
          </div>

          <div class="action-card-panel">
            <div class="actions-group">
              <button class="btn-primary btn-accent" id="continueBtn" type="button" style="display: none;" disabled>Continue to site</button>
              <button class="btn-close btn-ghost" id="closeBtn" type="button">Go back</button>
            </div>
            <div class="reset-note-bar">
              <div class="reset-note" id="resetNote"></div>
            </div>
          </div>

          <div class="adjust-note">To change this rule, open Stoic from your toolbar. Loosening it costs the same sixty seconds as pushing through it.</div>
        </section>

      </main>

    </div>
  </div>

<script src="common.js"></script>
<script src="progression-model.js"></script>
<script src="progression-store.js"></script>
<script src="blocked.js"></script>
</body>
</html>
